[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.backend"
watchPatterns = ["backend/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "Dockerfile.backend", "railway.backend.toml"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
